servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST", "ioi-infrafinder-preprd") %>
  worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST", "ioi-infrafinder-preprd") %>

proxy:
  host: next.infrafinder.instance.works

env:
  clear:
    RAILS_ENV: staging
    LOCATIONS_ROOT: https://next.infrafinder.instance.works
    # Until the admin SPA is deployed, developers run it locally against next.
    LOCATIONS_ADMIN_SPA: http://localhost:3000
    # Keeps cookies from colliding with the other environments under
    # infrafinder.instance.works.
    SESSION_BASE_KEY: _infra_sess_next
    UPLOAD_BUCKET: infrafinder-next
    UPLOAD_CDN_HOST: https://infrafinder-next.nyc3.cdn.digitaloceanspaces.com

service: infra-finder

image: infrafinder/infra_finder

require_destination: true

servers:
  web:
    cmd: bin/puma -C config/puma.rb
  worker:
    cmd: bin/good_job start --probe-port 7001

proxy:
  ssl: true
  app_port: 8080
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: registry.digitalocean.com
  username:
    - DIGITALOCEAN_ACCESS_TOKEN
  password:
    - DIGITALOCEAN_ACCESS_TOKEN

# Images are built and pushed by .github/workflows/docker.yml, tagged with the
# commit SHA. Deploy with `--skip-push --version=<sha>`.
builder:
  arch: amd64
  dockerfile: Dockerfile
  target: prod
  context: .

env:
  clear:
    RACK_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    PORT: "8080"
    WEB_CONCURRENCY: "2"
    RAILS_MAX_THREADS: "5"
    MALLOC_ARENA_MAX: "2"
    LANG: en_US.UTF-8
    CLAIM_FORM_ENABLED: "true"
    CLAIM_FORM_URL: https://docs.google.com/forms/d/e/1FAIpQLSepEXJ_wzMWHkjZLGbvJgkZKj07VYQgS7dzuvhnocB8Bi5Luw/viewform
    # App Platform's do-connecting-ip header doesn't exist behind kamal-proxy,
    # and clients could spoof it. Fall back to X-Forwarded-For.
    SYSTEM_CLIENT_IP_HEADER: ""
    # DigitalOcean blocks outbound 587 on droplets.
    EMAIL_PORT: "2525"
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - CACHE_DATABASE_URL
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - SECURITY_HASH_SALT
    - SECURITY_NODE_SALT

ssh:
  user: root

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  dbconsole: app exec --interactive --reuse "bin/rails dbconsole -p"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

default: &default
  size_estimate_samples: 1000
  store_options: &default_store_options
    # Cap age of oldest cache entry to fulfill retention policies
    max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default
  database: cache
  store_options:
    <<: *default_store_options
    max_size: <%= 5.gigabytes %>

test:
  <<: *default
  database: cache
  store_options:
    <<: *default_store_options
    max_size: <%= 1.gigabyte %>

staging:
  <<: *default
  database: cache

production:
  <<: *default
  database: cache
  store_options:
    <<: *default_store_options
    max_size: <%= 10.gigabytes %>

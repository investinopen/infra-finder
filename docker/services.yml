services:
  base:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
  app:
    extends:
      file: ./services.yml
      service: base
    build:
      context: ..
      target: devel
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: ./compose.env
    volumes:
      - bundler_cache:/usr/local/bundle
      - node_cache:/srv/app/node_modules
      - minio_client:/root/.mc
      - docker_dummy:/srv/app/docker
      - ../:/srv/app

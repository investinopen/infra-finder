name: Setup
description: Install system packages, install tools via mise, and install bundler/yarn dependencies with caching

runs:
  using: composite
  steps:
    - name: "Install Dependent libraries"
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get -yqq install libpq-dev libvips libvips-dev

    - name: "Install tools via mise"
      uses: jdx/mise-action@v4.3.0
      with:
        version: "2026.9.4"
        install: true
        export_path: true
        cache: true

    - name: "Configure bundler"
      shell: bash
      run: |
        bundle config set --local path vendor/bundle
        bundle config set --local deployment false

    - name: "Cache gems"
      uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('mise.lock') }}-${{ hashFiles('Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-${{ hashFiles('mise.lock') }}-

    - name: "Install gems"
      shell: bash
      run: |
        bundle install --jobs 4 --retry 3
        bundle clean

    - name: "Resolve yarn cache folder"
      id: yarn-cache-dir
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - name: "Cache yarn packages"
      uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: "Install node packages"
      shell: bash
      run: yarn install --immutable

name: "Build & Push Docker"

on:
  workflow_call:
    inputs:
      version:
        description: "Release version to tag the image with (e.g. v1.2.3)"
        required: false
        type: string
      ref:
        description: "Branch to build (main or release); defaults to the triggering branch"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag the image with (e.g. v1.2.3). Leave blank to skip version tagging."
        required: false
        type: string
      ref:
        description: "Branch to build (main or release); defaults to the selected branch"
        required: false
        type: string

concurrency:
  group: docker-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |-
            registry.digitalocean.com/infrafinder/infra_finder
          tags: |-
            type=raw,value=next,enable=${{ (inputs.ref || github.ref_name) == 'main' }}
            type=raw,value=latest,enable=${{ (inputs.ref || github.ref_name) == 'release' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to DOCR
        run: |
          doctl registry login --expiry-seconds 600
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: true
          file: Dockerfile
          target: prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args:
            "RAILS_ENV=production"

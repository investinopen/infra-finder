name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/rails_test"
  QUEUE_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/rails_queue_test"
  CACHE_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/rails_cache_test"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RAILS_ENV: test
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  RUBYOPT: "-W:no-deprecated -W:no-experimental"

jobs:
  erb_lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/setup

      - name: "Run ERB Lint"
        env:
          RAILS_ENV: development
        run: |
          bin/erb_lint .

  rubocop:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/setup

      - name: "Run Rubocop"
        env:
          RAILS_ENV: development
        run: |
          bin/rubocop --format github

  rspec:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.5-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/setup

      - name: "Set up DB"
        run: |
          bin/rails db:test:prepare

      - name: "Build assets"
        run: |
          bin/rails assets:precompile

      - name: "Run API specs"
        run: |
          bin/rspec

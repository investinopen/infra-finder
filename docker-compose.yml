services:
  db:
    extends:
      file: docker/services.yml
      service: base
    image: "postgres:15.5-alpine"
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    shm_size: 2g
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    extends:
      file: docker/services.yml
      service: base-redis
  test-redis:
    extends:
      file: docker/services.yml
      service: base-redis
  web:
    extends:
      file: docker/services.yml
      service: app
    tty: true
    stdin_open: true
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - minio_storage:/srv/minio
    ports:
      - "6856:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:8080/up"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 15s
  worker:
    extends:
      file: docker/services.yml
      service: app
    command: bin/good_job start --probe-port 7001
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - bundler_cache:/usr/local/bundle
      - node_cache:/srv/app/node_modules
      - ./:/srv/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:7001/status/started"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
  assets:
    extends:
      file: docker/services.yml
      service: app
    command: yarn dev:watch
    depends_on:
      migrations:
        condition: service_completed_successfully
  spec:
    extends:
      file: docker/services.yml
      service: app
    command: tail -f /dev/null
    environment:
      - RACK_ENV=test
      - RAILS_ENV=test
      - REDIS_URL=redis://test-redis:6379
  mailcatcher:
    extends:
      file: docker/services.yml
      service: base
    image: "sj26/mailcatcher:v0.8.2"
    ports:
      - "6857:1080"
  minio:
    extends:
      file: docker/services.yml
      service: base
    image: "minio/minio:RELEASE.2022-09-25T15-44-53Z"
    command: server --console-address ":9001" /data
    env_file:
      - docker/minio.env
    ports:
      - "6858:9000"
      - "6859:9001"
    volumes:
      - minio_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  minio-proxy:
    extends:
      file: docker/services.yml
      service: base
    image: nginx:1.19.2-alpine
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
  minio-client:
    entrypoint: "/root/.mc/initialize.sh"
    image: "minio/mc:RELEASE.2022-09-16T09-16-47Z"
    depends_on:
      minio:
        condition: service_healthy
      minio-proxy:
        condition: service_started
    env_file:
      - docker/compose.env
      - docker/minio.env
    restart: "no"
    volumes:
      - ./docker/minio/client:/root/.mc
  migrations:
    extends:
      file: docker/services.yml
      service: app
    command: /usr/local/bin/run-migrations
    depends_on:
      minio-client:
        condition: service_completed_successfully
    restart: "no"

volumes:
  bundler_cache:
    driver: local
  minio_storage:
    driver: local
  node_cache:
    driver: local
  postgres-data:
    driver: local
  upload_storage:
    driver: local
